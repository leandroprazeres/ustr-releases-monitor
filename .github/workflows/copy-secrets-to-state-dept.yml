name: Copy notification secrets to State Department bot

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets
        env:
          MIGRATION_GITHUB_TOKEN: ${{ secrets.MIGRATION_GITHUB_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: |
          python -m pip install -q PyNaCl
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from nacl import encoding, public

          owner = "leandroprazeres"
          repo = "state-dept-release-bot"
          token = os.environ["MIGRATION_GITHUB_TOKEN"]
          names = [
              "EMAIL_SENDER",
              "EMAIL_PASSWORD",
              "EMAIL_RECEIVER",
              "CALLMEBOT_PHONE",
              "CALLMEBOT_API_KEY",
          ]
          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "state-secret-migration",
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{owner}/{repo}/actions/secrets/public-key",
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              key = json.load(response)

          public_key = public.PublicKey(key["key"].encode("utf-8"), encoding.Base64Encoder())
          sealed_box = public.SealedBox(public_key)

          copied = []
          for name in names:
              value = os.environ.get(name)
              if not value:
                  continue
              encrypted = base64.b64encode(sealed_box.encrypt(value.encode("utf-8"))).decode("utf-8")
              payload = json.dumps({
                  "encrypted_value": encrypted,
                  "key_id": key["key_id"],
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{repo}/actions/secrets/{name}",
                  data=payload,
                  headers={**headers, "Content-Type": "application/json"},
                  method="PUT",
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status not in (201, 204):
                      raise RuntimeError(f"Unexpected status for {name}: {response.status}")
              copied.append(name)
          print("Copied secrets:", ", ".join(copied))
          PY
